name: corpus

# Once a month, finds new pages in the AWS and Kubernetes sitemaps and opens
# (or updates) a pull request that adds them as a new season starting two
# weeks later. The pull request is opened with a GitHub App token, so its CI runs
# like any other pull request's.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # No token left in .git/config and no dependency install scripts while
      # outside HTML is parsed; only the pull request step gets write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Discover and build new articles
        run: npm run corpus

      # Created after the outside HTML is parsed, so only the pull request step
      # holds a write token. GITHUB_TOKEN would not start CI on the pull request.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: corpus/next
          add-paths: corpus
          commit-message: 'feat(corpus): add newly discovered documentation pages'
          title: 'feat(corpus): add newly discovered documentation pages'
          body: >-
            New articles found in the documentation sitemaps, added as a new
            season. Merge before the season starts (see `startPuzzle` in
            `corpus/<board>/manifest.json`); after that, CI and the deploy refuse it and
            this workflow has to run again.

name: corpus

# Once a month, finds new pages in the AWS and Kubernetes sitemaps and opens
# (or updates) a pull request that adds them as a new season starting two
# weeks later. Requires Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests".
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # No token left in .git/config and no dependency install scripts while
      # outside HTML is parsed; only the pull request step gets write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Discover and build new articles
        run: npm run corpus

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: corpus/next
          add-paths: corpus
          commit-message: 'feat(corpus): add newly discovered documentation pages'
          title: 'feat(corpus): add newly discovered documentation pages'
          body: >-
            New articles found in the documentation sitemaps, added as a new
            season. Merge before the season starts (see `startPuzzle` in
            `corpus/<board>/manifest.json`); after that, CI and the deploy refuse it and
            this workflow has to run again.

      # Pull requests opened with GITHUB_TOKEN do not start other workflows.
      - name: Run CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref corpus/next

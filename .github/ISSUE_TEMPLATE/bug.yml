name: Bug
description: The game or a script in this repository misbehaves.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What you did
      placeholder: Opened /redocted/pt-br/?c=k8s&p=3 and guessed "pods"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 150, Android
